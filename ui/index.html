<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Urbane Threads Support Copilot — domain-aligned customer support demo" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Support Copilot · Urbane Threads</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('ut-theme');
          var dark = pref === 'dark' || ((!pref || pref === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
