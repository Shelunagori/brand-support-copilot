# Template only: never commit real values. Create with
#   kubectl -n support-copilot create secret generic copilot-secrets \
#     --from-literal=NUGEN_API_KEY=... --from-literal=DATABASE_URL=... \
#     --from-literal=REDIS_URL=... --from-literal=CLIENT_API_KEYS=...
# or sync from Azure Key Vault with the Secrets Store CSI driver.
apiVersion: v1
kind: Secret
metadata:
  name: copilot-secrets
  namespace: support-copilot
type: Opaque
stringData:
  NUGEN_API_KEY: "<from-key-vault>"
  DATABASE_URL: "postgresql+asyncpg://copilot:<password>@<server>.postgres.database.azure.com:5432/copilot?ssl=require"
  REDIS_URL: "rediss://:<access-key>@<name>.redis.cache.windows.net:6380/0"
  CLIENT_API_KEYS: "<comma-separated client keys>"
